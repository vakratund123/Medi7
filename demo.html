<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MEDI7 &mdash; Paperless Hospital Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#2563eb;--pl:#dbeafe;--pd:#1e40af;
  --v:#7c3aed;--vl:#ede9fe;
  --e:#059669;--el:#d1fae5;
  --o:#d97706;--ol:#fef3c7;
  --r:#dc2626;--rl:#fee2e2;
  --k:#db2777;--kl:#fce7f3;
  --s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;
  --s400:#94a3b8;--s500:#64748b;--s600:#475569;
  --s700:#334155;--s800:#1e293b;--s900:#0f172a;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--s50);color:var(--s800);min-height:100vh}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:248px;min-width:248px;background:#fff;border-right:1px solid var(--s100);display:flex;flex-direction:column}
.sb-logo{display:flex;align-items:center;gap:10px;padding:18px;border-bottom:1px solid var(--s100)}
.li{width:36px;height:36px;background:var(--p);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.li svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.lt .br{font-size:15px;font-weight:800;color:var(--s900)}
.lt .su{font-size:11px;color:var(--s400);margin-top:1px}
.sb-u{padding:12px 16px;border-bottom:1px solid var(--s100)}
.rb{display:inline-flex;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;color:#fff;margin-bottom:4px}
.un{font-size:13px;font-weight:600;color:var(--s800)}
.sb-nav{flex:1;overflow-y:auto;padding:8px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--s600);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s;font-family:inherit;position:relative}
.ni:hover{background:var(--s50);color:var(--s900)}
.ni.act{background:var(--pl);color:var(--p);font-weight:600}
.ni svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.nbadge{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--r);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
.sb-ft{padding:10px;border-top:1px solid var(--s100)}
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tb{background:#fff;border-bottom:1px solid var(--s100);padding:0 24px;height:56px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.tt{font-size:15px;font-weight:600;color:var(--s800)}
.ts{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--s400)}
.sd{width:8px;height:8px;border-radius:50%;background:var(--e);box-shadow:0 0 0 3px rgba(5,150,105,.15);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pc{flex:1;overflow-y:auto;padding:24px;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* cards */
.card{background:#fff;border-radius:16px;border:1px solid var(--s100);padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sc{background:#fff;border-radius:16px;border:1px solid var(--s100);padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.si{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.si svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.sv2{font-size:28px;font-weight:800;color:var(--s800);line-height:1}
.sl{font-size:12px;color:var(--s500);margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mb4{margin-bottom:16px}.mb6{margin-bottom:24px}
/* table */
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--s100)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;background:var(--s50);font-weight:600;font-size:11px;color:var(--s500);text-transform:uppercase;letter-spacing:.5px}
td{padding:12px 14px;border-top:1px solid var(--s100);color:var(--s700)}
tr:hover td{background:var(--s50)}
/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.bb{background:var(--pl);color:var(--p)}.bg2{background:var(--el);color:var(--e)}
.bo{background:var(--ol);color:var(--o)}.br2{background:var(--rl);color:var(--r)}
.bv{background:var(--vl);color:var(--v)}.bk{background:var(--s100);color:var(--s500)}
.bk2{background:#fef9c3;color:#854d0e}
/* btns */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.bp{background:var(--p);color:#fff}.bp:hover{background:var(--pd)}
.bs2{background:var(--s100);color:var(--s700)}.bs2:hover{background:var(--s200)}
.bg3{background:var(--el);color:var(--e)}.bg3:hover{background:#a7f3d0}
.bsm{padding:5px 10px;font-size:12px}
.bxs{padding:4px 8px;font-size:11px}
/* section header */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--s800)}
.stl svg{width:16px;height:16px;stroke:var(--p);fill:none;stroke-width:2}
/* patient card */
.pc2{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--s100);background:#fff;margin-bottom:10px;cursor:pointer;transition:all .15s}
.pc2:hover{border-color:var(--p);box-shadow:0 4px 12px rgba(37,99,235,.1)}
.av{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.pn{font-size:14px;font-weight:600;color:var(--s800)}
.ps{font-size:12px;color:var(--s400);margin-top:2px}
.pr2{margin-left:auto;text-align:right}
/* modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.md{background:#fff;border-radius:20px;padding:0;width:92%;max-width:620px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.2)}
.md-hd{padding:20px 24px 0;flex-shrink:0}
.md-bd{padding:0 24px 24px;overflow-y:auto;flex:1}
.mt2{font-size:18px;font-weight:700;color:var(--s900)}
.ms2{font-size:13px;color:var(--s400);margin-top:2px;margin-bottom:12px}
.mc{float:right;cursor:pointer;font-size:18px;color:var(--s400);border:none;background:none;font-family:inherit;line-height:1;padding:2px}
/* tabs */
.tabs{display:flex;gap:2px;background:var(--s100);border-radius:10px;padding:3px;margin-bottom:16px}
.tab{flex:1;padding:7px 4px;border-radius:8px;border:none;background:none;font-size:12px;font-weight:600;color:var(--s500);cursor:pointer;font-family:inherit;transition:all .15s;text-align:center}
.tab.act{background:#fff;color:var(--p);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tabpane{display:none}.tabpane.show{display:block}
/* form */
.fg{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--s600);margin-bottom:5px}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=file],select,textarea{width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--s200);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
textarea{resize:vertical;min-height:70px}
/* checkboxes */
.chkgroup{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.chkitem{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--s200);cursor:pointer;font-size:13px;transition:all .15s}
.chkitem:hover{border-color:var(--p);background:var(--pl)}
.chkitem input[type=checkbox]{width:auto;accent-color:var(--p)}
/* ai box */
.ai{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1.5px solid #c7d2fe;border-radius:14px;padding:16px;margin-bottom:14px}
.ail{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--v);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.ail svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.ait{font-size:13px;color:var(--s700);line-height:1.6}
/* wa */
.wa{display:flex;align-items:center;gap:10px;background:#dcfce7;border-radius:12px;padding:10px 14px;font-size:12px;color:#166534;font-weight:500;margin-top:8px}
/* report card */
.rcard{background:var(--s50);border-radius:12px;border:1px solid var(--s200);padding:14px;margin-top:8px}
.rcard-title{font-size:13px;font-weight:700;color:var(--s800);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.rcard-sub{font-size:12px;color:var(--s500)}
/* inv bar */
.ibw{height:6px;background:var(--s100);border-radius:999px;overflow:hidden;margin-top:6px}
.ib{height:100%;border-radius:999px}
/* timeline */
.tl{position:relative;padding-left:24px}
.tl::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--s100)}
.ti{position:relative;margin-bottom:16px}
.td2{position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--s200)}
.td2.done{background:var(--e);box-shadow:0 0 0 2px rgba(5,150,105,.2)}
.td2.act2{background:var(--p);box-shadow:0 0 0 2px rgba(37,99,235,.2);animation:pulse 2s infinite}
.td2.pnd{background:var(--s300)}
.ttl2{font-size:13px;font-weight:600;color:var(--s800)}
.tts{font-size:12px;color:var(--s400);margin-top:2px}
/* toast */
.toast{position:fixed;bottom:24px;right:24px;z-index:300;background:var(--s800);color:#fff;border-radius:14px;padding:14px 20px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:su .3s ease;max-width:380px}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.toast svg{width:18px;height:18px;stroke:var(--e);fill:none;stroke-width:2;flex-shrink:0}
/* search */
.sbar{display:flex;align-items:center;gap:10px;background:var(--s50);border:1.5px solid var(--s200);border-radius:12px;padding:9px 14px;margin-bottom:16px}
.sbar svg{width:16px;height:16px;stroke:var(--s400);fill:none;stroke-width:2;flex-shrink:0}
.sbar input{border:none;background:none;outline:none;font-size:13px;flex:1;font-family:inherit}
/* cw chart */
.cw{position:relative;height:200px}
/* login */
.lp{min-height:100vh;background:linear-gradient(135deg,#1e40af 0%,#1e3a8a 40%,var(--s900) 100%);display:flex;align-items:center;justify-content:center;padding:24px;position:fixed;inset:0;z-index:200}
.lg1{position:absolute;top:25%;left:-80px;width:350px;height:350px;border-radius:50%;background:rgba(37,99,235,.25);filter:blur(60px);pointer-events:none}
.lg2{position:absolute;bottom:20%;right:-80px;width:300px;height:300px;border-radius:50%;background:rgba(124,58,237,.2);filter:blur(60px);pointer-events:none}
.lc{width:100%;max-width:420px;position:relative;z-index:1}
.lh{text-align:center;margin-bottom:28px}
.llr{width:64px;height:64px;margin:0 auto 14px;background:rgba(255,255,255,.1);border-radius:18px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px)}
.llr svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2}
.lh h1{font-size:30px;font-weight:800;color:#fff}
.lh p{font-size:13px;color:rgba(147,197,253,1);margin-top:4px}
.lb{background:#fff;border-radius:24px;padding:32px;box-shadow:0 24px 48px rgba(0,0,0,.25)}
.lb h2{font-size:18px;font-weight:700;color:var(--s800)}
.lb p{font-size:13px;color:var(--s400);margin-top:2px;margin-bottom:20px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.cb{padding:8px 10px;border-radius:10px;background:var(--s50);border:1.5px solid var(--s100);cursor:pointer;text-align:left;transition:all .15s;font-family:inherit}
.cb:hover{background:var(--pl);border-color:var(--p)}
.cr{font-size:11px;font-weight:700;color:var(--s700)}
.ce{font-size:10px;color:var(--s400);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lf{text-align:center;margin-top:14px;font-size:11px;color:rgba(147,197,253,.7)}
/* hamburger */
.hbg{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:none;background:var(--s50);cursor:pointer;margin-right:4px}
.hbg svg{width:18px;height:18px;stroke:var(--s600);fill:none;stroke-width:2}
/* info row */
.inforow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.infochip{background:var(--s50);border:1px solid var(--s200);border-radius:8px;padding:6px 12px;font-size:12px}
.infochip b{color:var(--s800)}
/* section divider */
.sdiv{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--s400);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sdiv::after{content:'';flex:1;height:1px;background:var(--s100)}
/* empty state */
.empty{text-align:center;padding:32px;color:var(--s400);font-size:13px}
@media(max-width:768px){
  .sb{position:fixed;left:-260px;top:0;bottom:0;z-index:50;transition:left .3s}
  .sb.open{left:0;box-shadow:4px 0 24px rgba(0,0,0,.15)}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .tb{padding:0 16px}.pc{padding:16px}
  .hbg{display:flex!important}
}
@media print {
  body * { visibility: hidden !important; }
  #official-bill-print, #official-bill-print * { visibility: visible !important; }
  #official-bill-print {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .print-hide { display: none !important; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="lp" id="loginPage">
  <div class="lg1"></div><div class="lg2"></div>
  <div class="lc">
    <div class="lh">
      <div class="llr"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
      <h1>MEDI7</h1><p>Sai Hospital &middot; Digital Health System</p>
    </div>
    <div class="lb">
      <h2>Sign In</h2><p>Access your role-based dashboard</p>
      <div class="fg"><label>Email Address</label><input type="email" id="le" placeholder="dr.priya@saihospital.in" autocomplete="username"/></div>
      <div class="fg"><label>Password</label><input type="password" id="lp2" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password"/></div>
      <button class="btn bp" style="width:100%;justify-content:center;padding:11px" onclick="doLogin()">Sign In</button>
      <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--s100)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--s600)">&#9889; Official Staff Logins (5 IDs)</div>
          <div style="font-size:11px;font-weight:600;color:var(--p)">WA: +919632219690</div>
        </div>
        <div class="cg">
          <button class="cb" onclick="fc('manager@saihospital.in','Admin@123')"><div class="cr">&#127973; Manager</div><div class="ce">manager@saihospital.in</div></button>
          <button class="cb" onclick="fc('doctor@saihospital.in','Doctor@123')"><div class="cr">&#128104;&#8205;&#9877;&#65039; Doctor</div><div class="ce">doctor@saihospital.in</div></button>
          <button class="cb" onclick="fc('reception@saihospital.in','Recept@123')"><div class="cr">&#128187; Reception</div><div class="ce">reception@saihospital.in</div></button>
          <button class="cb" onclick="fc('laboratory@saihospital.in','Lab@1234')"><div class="cr">&#128300; Laboratory</div><div class="ce">laboratory@saihospital.in</div></button>
          <button class="cb" onclick="fc('pharmacy@saihospital.in','Pharm@123')"><div class="cr">&#128138; Pharmacy</div><div class="ce">pharmacy@saihospital.in</div></button>
        </div>
      </div>
    </div>
    <div class="lf">Sai Multispecialty Hospital &middot; +919632219690 &middot; MEDI7 v1.0</div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="mainApp" style="display:none">
  <aside class="sb" id="sidebar">
    <div class="sb-logo">
      <div class="li"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
      <div class="lt"><div class="br">MEDI7</div><div class="su">Sai Hospital</div></div>
    </div>
    <div class="sb-u"><div class="rb" id="roleBadge"></div><div class="un" id="userName"></div></div>
    <nav class="sb-nav" id="sbnav"></nav>
    <div class="sb-ft"><button class="ni" style="color:var(--r)" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out</button></div>
  </aside>
  <div class="mn">
    <header class="tb">
      <button class="hbg" onclick="toggleSB()"><svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="tt" id="ptitle">Dashboard</div>
      <div class="ts"><div class="sd"></div>System Online &mdash; Live Demo</div>
    </header>
    <div class="pc" id="pgcontent"></div>
  </div>
</div>

<!-- MODAL -->
<div class="mo" id="moverlay" style="display:none" onclick="overlayClick(event)">
  <div class="md" id="mbox">
    <div class="md-hd" id="mhd"></div>
    <div class="md-bd" id="mbd"></div>
  </div>
</div>

<!-- TOAST -->

function fc(e,p){document.getElementById('le').value=e;document.getElementById('lp2').value=p;}
function doLogin(){
  const em=document.getElementById('le').value.trim(), pw=document.getElementById('lp2').value;
  if(!em||!pw)return toast2('Please enter credentials',1);
  if(!USERS[em]||PW[em]!==pw)return toast2('Invalid credentials',1);
  CU={email:em,...USERS[em]};
  document.getElementById('loginPage').style.display='none';

function buildNav(){
  const b=document.getElementById('roleBadge');b.textContent=CU.label;b.style.background=CU.color;
  document.getElementById('userName').textContent=CU.name;
  const nav=document.getElementById('sbnav'); nav.innerHTML='';
  NAV[CU.role].forEach(item=>{
    const btn=document.createElement('button');
    btn.className='ni'; btn.id='nav-'+item.pg;
    btn.innerHTML=sv(item.ic)+'<span>'+item.l+'</span>';
    btn.onclick=()=>navigate(item.pg);
    nav.appendChild(btn);
  });
  updateBadges();
}
function updateBadges(){
  // Lab pending count
  const lp=STATE.labOrders.filter(o=>o.st==='ordered'||o.st==='sample_collected').length;
  const rp=STATE.radOrders.filter(o=>o.st==='ordered').length;
  const pp=STATE.prescriptions.filter(o=>!o.dispensed).length;
  const drLab=STATE.labOrders.filter(o=>STATE.labReports[o.id]).length;
  const drRad=STATE.radOrders.filter(o=>STATE.radScans[o.id]).length;
  setBadge('nav-labO', lp);
  setBadge('nav-radO', rp);
  setBadge('nav-phD', pp);
  setBadge('nav-drLab', drLab);
  setBadge('nav-drRad', drRad);
}
function setBadge(navId, count){
  const el=document.getElementById(navId); if(!el) return;
  let b=el.querySelector('.nbadge');
  if(count>0){
    if(!b){b=document.createElement('span');b.className='nbadge';el.appendChild(b);}
    b.textContent=count;
  } else if(b){ b.remove(); }
}

function navigate(pg){
  document.querySelectorAll('.ni').forEach(el=>el.classList.remove('act'));
  const a=document.getElementById('nav-'+pg); if(a) a.classList.add('act');
  document.getElementById('sidebar').classList.remove('open');

  const R={ownerDash,opdQ,regPat,drQ,drLab,drRad,labO,radO,phD,invt};
  if(R[pg]) R[pg](el);

function downloadReferralsCSV(){
  let csv="Date,Patient ID,Patient Name,Mobile,Age,Gender,Referred By Doctor,Attending Doctor,Complaint/Diagnosis\n";
  STATE.patients.forEach(p=>{
    csv+=`2026-09-08,${p.id},"${p.name}",${p.phone},${p.age},${p.gender},"${p.ref||'Self / Walk-in'}","${p.dr}","${p.dx}"\n`;
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=window.URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download="sai_hospital_referrals_2026_09.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  window.URL.revokeObjectURL(url);
  toast2("Doctor Referrals CSV Downloaded!");
}

function getAIFindings(test){

  return d[test]||'&#10003;&#65039; All parameters within normal reference range. No immediate action required.';
}
function uploadReport(id){
  const o=STATE.labOrders.find(x=>x.id===id);
  const fileEl=document.getElementById('rptFile');
  const remarks=document.getElementById('rptRemarks').value;

  const tm=nowTime();
  function doStore(fname, dataURL, mime){
    STATE.labReports[id]={file:fname, dataURL:dataURL, mime:mime||'', remarks:remarks, ai:aiText, at:tm, by:CU.name};
    o.st='reported';
    STATE.actLog.unshift({a:'upload lab report',e:'lab order',by:CU.name,t:tm});
    showM(
      '<button class="mc" onclick="closeM()">&#x2715;</button><div class="mt2" style="color:#059669">&#9989; Report Uploaded!</div><div class="ms2">Lab results now visible to '+o.dr+'</div>',

      (dataURL&&mime&&mime.startsWith('image/')? '<img src="'+dataURL+'" style="width:100%;max-height:200px;object-fit:contain;border-radius:12px;border:1px solid var(--s200);margin-bottom:12px"/>':'')+(dataURL&&mime==='application/pdf'? '<div style="background:var(--s100);padding:10px;border-radius:10px;margin-bottom:12px;font-size:12px;color:var(--s700)">📄 PDF Report Attached</div>':'') +
      '<div style="background:var(--s50);border-radius:12px;border:1px solid var(--s200);padding:12px;margin-bottom:10px;font-size:13px">&#128196; <b>'+fname+'</b> uploaded successfully</div>'+
      '<div class="wa"><span>&#128172;</span> Report sent to patient via WhatsApp. <b>'+o.dr+'</b> notified &mdash; they can now view this report.</div>'+
      '<button class="btn bp" style="width:100%;justify-content:center;margin-top:14px" onclick="closeM();labO(document.getElementById(\'pgcontent\'))">Back to Lab Orders</button>'
    );
    updateBadges();
  }
  if(fileEl.files.length>0){
    const file=fileEl.files[0];
    const reader=new FileReader();
    reader.onload=e=>doStore(file.name, e.target.result, file.type);
    reader.readAsDataURL(file);
  } else {
    doStore(o.test.replace(/\s+/g,'_')+'_Report.pdf', null, 'application/pdf');
  }
}

function searchDemoTablets(query){
  const box = document.getElementById('rx-suggestions');
  if(!box) return;
  if(!query || !query.trim()){
    box.style.display = 'none';
    return;
  }
  const q = query.toLowerCase();
  const matches = DEMO_TABLETS.filter(t => t.name.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q)).slice(0, 10);
  if(matches.length === 0){
    box.innerHTML = '<div style="padding:10px;font-size:11px;color:var(--s400);text-align:center">No matching tablets found. Type full name manually below.</div>';
    box.style.display = 'block';
    return;
  }
  let h = '<div style="padding:6px 10px;background:var(--s50);font-size:10px;font-weight:700;color:var(--s500);text-transform:uppercase;border-bottom:1px solid var(--s200)">Tablet Suggestions (' + matches.length + ') &mdash; Click to add</div>';
  matches.forEach(t => {
    h += '<div style="padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--s100);display:flex;justify-content:space-between;align-items:center" onmouseover="this.style.background=\'#f1f5f9\'" onmouseout="this.style.background=\'#fff\'" onclick="selectDemoTablet(\''+t.name.replace(/'/g, "\\'")+'\',\''+t.dose+'\',\''+t.freq+'\',\''+t.dur+'\',\''+t.inst+'\')">'+
      '<div><div style="font-size:12px;font-weight:700;color:var(--s900)">'+t.name+' <span style="font-size:10px;padding:1px 6px;border-radius:4px;background:#e0f2fe;color:#0284c7;font-weight:600">'+t.cat+'</span></div>'+
      '<div style="font-size:10.5px;color:var(--s500);margin-top:2px">'+t.dose+' &bull; '+t.freq+' &bull; '+t.dur+' ('+t.inst+')</div></div>'+
      '<div style="font-size:11px;font-weight:700;color:var(--p)">+ Add</div>'+
      '</div>';
  });
  box.innerHTML = h;
  box.style.display = 'block';
}

function selectDemoTablet(name, dose, freq, dur, inst){
  const tx = document.getElementById('crxtext');
  const line = name + ' &mdash; ' + freq + ' x ' + dur + ' (' + inst + ')';
  if(tx){
    const curr = tx.value.trim();
    if(!curr || curr.includes('1. Metformin 500mg BD x 30 days\n2. Amlodipine')){
      tx.value = '1. ' + line;
    } else {
      const lines = curr.split('\n').filter(Boolean);
      tx.value = curr + '\n' + (lines.length + 1) + '. ' + line;
    }
  }
  const sInput = document.getElementById('rxsearch');
  if(sInput) sInput.value = '';
  const box = document.getElementById('rx-suggestions');
  if(box) box.style.display = 'none';
  toast2('Added ' + name + ' to prescription');
}

function calcDemoBill(){
  const sub = window._currentBillItems.reduce((acc, x) => acc + (Number(x.total)||0), 0);
  const discEl = document.getElementById('bdiscount');
  const disc = discEl ? (Number(discEl.value)||0) : 0;
  const net = Math.max(0, sub - disc);
  const el = document.getElementById('bill-net-display');
  if(el) el.innerHTML = '&#8377;' + net.toFixed(2);
}

function saveConsult(pid){
  const p=STATE.patients.find(x=>x.id===pid);
  const dx=document.getElementById('cdx')?document.getElementById('cdx').value.trim():'';
  const rx=document.getElementById('crxtext')?document.getElementById('crxtext').value.trim():'';
  const notes=document.getElementById('cnotes')?document.getElementById('cnotes').value.trim():'';
  if(!dx||!rx) return toast2('Please fill diagnosis and prescription',1);

  // Save consultation
  STATE.consultations[pid]={dx,rx,notes,by:CU.name,at:nowTime()};
  p.st='completed';

  // Collect selected lab tests
  const labTests=LAB_TESTS.filter((_,i)=>{const el=document.getElementById('lab_'+i);return el&&el.checked;});
  labTests.forEach(t=>{
    STATE.seq.lab++;
    STATE.labOrders.push({id:'LAB-00'+STATE.seq.lab,pid,pt:p.name,test:t,dr:CU.name,tm:nowTime(),st:'ordered',urg:false});
  });

  // Collect selected radiology scans
  const radScans=RAD_SCANS.filter((_,i)=>{const el=document.getElementById('rad_'+i);return el&&el.checked;});
  radScans.forEach(s=>{
    STATE.seq.rad++;
    STATE.radOrders.push({id:'RAD-00'+STATE.seq.rad,pid,pt:p.name,scan:s,dr:CU.name,tm:nowTime(),st:'ordered'});
  });

  // Create prescription
  STATE.seq.rx++;
  STATE.prescriptions.push({id:'RX-00'+STATE.seq.rx,pid,pt:p.name,meds:rx,dr:CU.name,tm:nowTime(),dispensed:false});

  // Save final bill with Doctor pricing
  STATE.seq.bill = (STATE.seq.bill || 1) + 1;
  const billItems = (window._currentBillItems && window._currentBillItems.length > 0)
    ? [...window._currentBillItems]
    : [{ name: 'Doctor Consultation Fee', category: 'Consultation', qty: 1, rate: 300, total: 300 }];
  const subtotal = billItems.reduce((acc, it) => acc + Number(it.total||0), 0);
  const discEl = document.getElementById('bdiscount');
  const discount = discEl ? (Number(discEl.value)||0) : 0;
  const net = Math.max(0, subtotal - discount);
  const modeEl = document.getElementById('bmode');
  const mode = modeEl ? modeEl.value : 'Cash';
  const statEl = document.getElementById('bstatus');
  const bstatus = statEl ? statEl.value : 'pending';
  const notesEl = document.getElementById('bnotes');
  const bnotes = notesEl ? notesEl.value : '';

  STATE.bills[pid] = {
    billNo: 'SEMH-B26-' + String(STATE.seq.bill).padStart(4, '0'),
    date: new Date().toLocaleDateString('en-GB'),
    items: billItems,
    subtotal,
    discount,
    net,
    st: bstatus,
    mode,
    notes: bnotes,
    dr: CU.name,
    by: CU.name,
  };

  // Activity log
  STATE.actLog.unshift({a:'generate bill & consultation',e:'bill',by:CU.name,t:nowTime()});

  const summary=[];
  if(labTests.length>0) summary.push('<div class="wa" style="margin-bottom:6px"><span>&#128300;</span> '+labTests.length+' lab test(s) sent to Lab Technician: '+labTests.slice(0,2).join(', ')+(labTests.length>2?'...':'')+'</div>');
  if(radScans.length>0) summary.push('<div class="wa" style="background:#fef3c7;color:#92400e;margin-bottom:6px"><span>&#129981;</span> '+radScans.length+' radiology order(s) sent to Radiologist: '+radScans.slice(0,2).join(', ')+(radScans.length>2?'...':'')+'</div>');
  summary.push('<div class="wa" style="margin-bottom:6px"><span>&#128138;</span> Prescription sent to Pharmacy for '+p.name+'</div>');
  summary.push('<div class="wa" style="margin-bottom:6px"><span>&#129534;</span> <b>Final Bill Generated:</b> '+STATE.bills[pid].billNo+' &mdash; &#8377;'+net.toFixed(2)+' ('+bstatus.toUpperCase()+')</div>');
  summary.push('<div class="wa" style="margin-bottom:0"><span>&#128172;</span> Official Letterhead Bill &amp; Prescription PDF sent to patient via WhatsApp (+91 96322 19690)</div>');

  showM(
    '<button class="mc" onclick="closeM()">&#x2715;</button><div class="mt2" style="color:#059669">&#9989; Consultation &amp; Final Bill Saved!</div><div class="ms2">All orders and bill generated on official letterhead</div>',
    summary.join('')+
    '<div style="background:var(--s50);border-radius:12px;padding:14px;margin-top:14px;font-size:13px;line-height:1.8">'+
    '<b>Diagnosis:</b> '+dx+'<br/><b>Bill Reference:</b> '+STATE.bills[pid].billNo+' (&#8377;'+net.toFixed(2)+')<br/><b>Prescription:</b><br/><span style="white-space:pre-line">'+rx+'</span>'+
    (notes?'<br/><b>Notes:</b> '+notes:'')+'</div>'+
    '<div style="display:flex;gap:10px;margin-top:14px">'+
    '<button class="btn bp" style="flex:1;justify-content:center;background:#1d4ed8" onclick="openLetterheadBillModal(\''+pid+'\')">&#128438;&#65039; Print Final Bill (Official Letterhead)</button>'+
    '<button class="btn bs2" style="justify-content:center" onclick="closeM();navigate(\'drQ\')">Back to Queue</button>'+
    '</div>'
  );
  updateBadges();
}

  );
}

/* ═══════════════════════════════════════
   KEYBOARD
═══════════════════════════════════════ */
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
document.getElementById('lp2').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>

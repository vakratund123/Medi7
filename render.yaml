services:
  # ─── FastAPI Backend ─────────────────────────────────
  - type: web
    name: medi7-backend
    env: python
    plan: free
    region: singapore
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: medi7-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: local

databases:
  # ─── Managed PostgreSQL Database ──────────────────────
  - name: medi7-db
    databaseName: medi7db
    user: medi7
    plan: free
    region: singapore
